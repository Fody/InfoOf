name: on-push-do-doco
on:
  push:
jobs:
  release:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
    - name: Run MarkdownSnippets
      run: |
        dotnet tool install --global MarkdownSnippets.Tool
        mdsnippets ${GITHUB_WORKSPACE}
      shell: bash
    - name: Push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -m "Doco changes" -a || { echo "nothing to commit"; exit 0; }
        remote="https://${GITHUB_ACTOR}:${{secrets.GITHUB_TOKEN}}@github.com/${GITHUB_REPOSITORY}.git"
        branch="${GITHUB_REF:11}"
        # Not masked. The ruleset on the default branch requires the CI check, and this token cannot
        # bypass it, so a rejected push fails the job rather than losing the docs changes silently.
        git push "${remote}" ${branch}
      shell: bash